<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Paper Digest{% endblock %}</title>
  <meta name="description" content="A daily, machine-summarized digest of new AI research papers from arXiv.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ root }}style.css?v=4">
  <link rel="alternate" type="application/rss+xml" title="AI Paper Digest" href="{{ root }}feed.xml">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ root }}index.html">AI Paper Digest</a>
    <nav>
      <a href="{{ root }}archive.html">Archive</a>
      <a href="{{ root }}feed.xml">RSS</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Summaries are AI-generated and may contain errors; the linked paper is authoritative.
       Paper metadata comes from <a href="https://arxiv.org">arXiv</a> —
       thank you to arXiv for use of its open access interoperability.</p>
  </footer>
</body>
</html>
