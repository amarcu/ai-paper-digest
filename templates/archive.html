{% extends "base.html" %}
{% block title %}Archive — AI Paper Digest{% endblock %}
{% block content %}
  <h1>Archive</h1>
  {% include "calendar.html" %}
  <ul class="archive-list">
    {% for day in days %}
    <li>
      <a href="{{ root }}archive/{{ day.date }}.html">{{ day.date_human }}</a>
      <span class="count">{{ day.paper_count }} papers</span>
    </li>
    {% endfor %}
  </ul>
{% endblock %}
