<div class="cal" aria-label="Papers per day; select a square to open that digest">
  <div class="cal-months">
    {% for label in calendar.month_labels %}
    <span>{{ label }}</span>
    {% endfor %}
  </div>
  <div class="cal-grid">
    {% for week in calendar.weeks %}
    {% for cell in week %}
    {% if cell.count %}
    <a class="cal-cell l{{ cell.level }}" href="{{ root }}archive/{{ cell.date }}.html"
       title="{{ cell.label }}" aria-label="{{ cell.label }}"></a>
    {% else %}
    <span class="cal-cell{{ ' future' if cell.future }}" title="{{ cell.label }}"></span>
    {% endif %}
    {% endfor %}
    {% endfor %}
  </div>
</div>
