name: Deploy site

# Renders and publishes GitHub Pages whenever digest data lands on main —
# which is how the subscription (launchd) mode publishes: the local run pushes
# data/, this workflow does the rest. Rendering needs no API key.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "digest/render.py"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - run: python -m digest.render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
